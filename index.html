<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b100d">
<title>शुभ विवाह – जीतू संग सपना</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b100d}
body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;
  font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",Roboto,sans-serif;
  color:#f1e6d0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}

#scene{position:absolute;top:0;left:0;right:0;bottom:0;touch-action:none;
  display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 38%,#5a3b30 0%,#2d1a14 55%,#150b09 100%)}
#bookarea{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}

/* ---------- Book ---------- */
#bookwrap{position:relative;flex:0 0 auto;
  transform-origin:50% 60%;
  transition:transform 1.6s cubic-bezier(.18,.82,.22,1),opacity 1.1s ease}
#bookwrap.pre{opacity:0;
  transform:perspective(1400px) rotateX(16deg) rotateY(-40deg) translateY(46px) scale(.76)}

#backcover{position:absolute;left:-3px;top:-6px;right:-10px;bottom:-8px;z-index:0;
  border-radius:4px 11px 11px 4px;
  background:linear-gradient(135deg,#74354a 0%,#52243a 55%,#3b1a29 100%);
  box-shadow:0 22px 44px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,214,150,.18)}
#stack{position:absolute;left:0;top:0;right:0;bottom:0;z-index:1;border-radius:2px 5px 5px 2px;
  background:#e9e1cf;
  box-shadow:1px 1px 0 #cdc4ae,2px 1px 0 #efe8d6,3px 2px 0 #cdc4ae,4px 2px 0 #efe8d6,
             5px 3px 0 #cdc4ae,6px 3px 0 #efe8d6,7px 4px 0 #bdb39b;
  transition:opacity .4s}
#book{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;
  perspective:2300px;-webkit-perspective:2300px}

.leaf{position:absolute;left:0;top:0;width:100%;height:100%;
  transform-origin:0 50%;-webkit-transform-origin:0 50%;
  transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
  will-change:transform}
.face{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:2px 5px 5px 2px;background:#e4dcc8}
.face.back{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.bgthumb{position:absolute;left:0;top:0;width:100%;height:100%;
  background-size:cover;background-position:center;background-repeat:no-repeat}
.pg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;
  pointer-events:none;-webkit-user-drag:none;user-select:none}
.paper{position:absolute;left:0;top:0;width:100%;height:100%;
  background:linear-gradient(90deg,#d9d0ba 0%,#ece5d3 14%,#f1ebdb 60%,#e6dfcb 100%)}
.ghost{opacity:.10;transform:scaleX(-1)}
.spine{position:absolute;left:0;top:0;bottom:0;width:11%;pointer-events:none;
  background:linear-gradient(90deg,rgba(30,15,8,.34) 0%,rgba(30,15,8,.12) 28%,rgba(255,255,255,.10) 48%,rgba(255,255,255,0) 100%)}
.back .spine{left:auto;right:0;transform:scaleX(-1)}
.shade,.cast{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none}
.shade{background:linear-gradient(90deg,rgba(28,14,7,.62) 0%,rgba(28,14,7,.10) 85%)}
.cast{background:linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.22) 45%,rgba(0,0,0,0) 88%)}

#floor{position:absolute;left:4%;right:-3%;bottom:-26px;height:34px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 70%)}

/* ---------- UI ---------- */
#hint{flex:0 0 36px;height:36px;line-height:36px;text-align:center;font-size:13px;letter-spacing:.2px;
  color:#e8d5a8;opacity:0;transition:opacity .7s;pointer-events:none}
#hint.show{opacity:.85}
.ui{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;gap:16px;
  padding:0 12px env(safe-area-inset-bottom,0)}
.btn{width:44px;height:44px;border-radius:50%;padding:0;flex:0 0 auto;
  border:1px solid rgba(255,225,170,.38);background:rgba(255,235,200,.09);color:#f6e7c6;
  display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none;
  transition:opacity .25s,background .2s}
.btn:active{background:rgba(255,235,200,.22)}
.btn[disabled]{opacity:.22;pointer-events:none}
.dots{display:flex;gap:8px;align-items:center;min-width:90px;justify-content:center}
.dot{width:8px;height:8px;border-radius:8px;background:rgba(245,230,196,.3);
  transition:width .3s,background .3s}
.dot.on{width:22px;background:#f0c870}

body.land #hint{display:none}
body.land .ui{position:absolute;top:0;left:0;right:0;bottom:0;height:auto;padding:0 10px;
  justify-content:space-between;pointer-events:none}
body.land .dots{display:none}
body.land .btn{pointer-events:auto}
body.land .btn[disabled]{pointer-events:none}
@media (prefers-reduced-motion:reduce){#bookwrap{transition-duration:.01s}}
</style>
</head>
<body>
<div id="scene">
  <div id="bookarea">
    <div id="bookwrap" class="pre">
      <div id="floor"></div>
      <div id="backcover"></div>
      <div id="stack"></div>
      <div id="book"></div>
    </div>
  </div>
  <div id="hint">पन्ना पलटने के लिए स्वाइप करें या टैप करें</div>
  <div class="ui">
    <button class="btn" id="prev" aria-label="पिछला पन्ना" disabled></button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="next" aria-label="अगला पन्ना"></button>
  </div>
</div>

var ALT=[
  'शुभ विवाह – जीतू संग सपना',
  'श्री गणेशाय नमः – आवरण',
  'विवाह निमंत्रण',
  'वैवाहिक कार्यक्रम'
];

var N=IMGS.length, RATIO=0.625;
var scene=document.getElementById('scene');
var wrap=document.getElementById('bookwrap');
var book=document.getElementById('book');
var stack=document.getElementById('stack');
var hint=document.getElementById('hint');
var btnPrev=document.getElementById('prev');
var btnNext=document.getElementById('next');
var dotsEl=document.getElementById('dots');

var SV='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">';
var ICON_PREV=SV+'<polyline points="15 5 8 12 15 19"/></svg>';
var ICON_NEXT=SV+'<polyline points="9 5 16 12 9 19"/></svg>';
var ICON_REPLAY=SV+'<path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><polyline points="4.5 3.5 4.5 8.5 9.5 8.5"/></svg>';
btnPrev.innerHTML=ICON_PREV;

/* ---------- build leaves ---------- */
var leaves=[], ang=[], dots=[];
function mk(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e;}

for(var i=0;i<N;i++){
  var leaf=mk('div','leaf');

  var f=mk('div','face front');
  var bg=mk('div','bgthumb'); bg.style.backgroundImage='url('+THUMBS[i]+')';
  var im=mk('img','pg'); im.alt=ALT[i]; im.draggable=false; im.src=IMGS[i];
  var sp=mk('div','spine'), cast=mk('div','cast'), fsh=mk('div','shade');
  f.appendChild(bg); f.appendChild(im); f.appendChild(sp); f.appendChild(cast); f.appendChild(fsh);

  var b=mk('div','face back');
  var paper=mk('div','paper');
  var gh=mk('img','pg ghost'); gh.alt=''; gh.draggable=false; gh.src=IMGS[i];
  var sp2=mk('div','spine'), bsh=mk('div','shade');
  b.appendChild(paper); b.appendChild(gh); b.appendChild(sp2); b.appendChild(bsh);

  leaf.appendChild(f); leaf.appendChild(b);
  book.appendChild(leaf);
  leaves.push({el:leaf,fshade:fsh,bshade:bsh,cast:cast,img:im,bface:b});
  ang.push(0);

  var d=mk('div','dot'); dotsEl.appendChild(d); dots.push(d);
}

/* ---------- sizing ---------- */
var pw=300;
function size(){
  var vw=window.innerWidth, vh=window.innerHeight;
  var land=vw>vh*1.1;
  document.body.className=land?'land':'';
  var availH=land?(vh-30):(vh-56-36-26);
  var availW=land?(vw-150):(vw-36);
  var h=Math.min(availH,1100), w=h*RATIO;
  if(w>availW){w=availW;h=w/RATIO;}
  if(w<120){w=120;h=w/RATIO;}
  wrap.style.width=Math.round(w)+'px';
  wrap.style.height=Math.round(h)+'px';
  pw=w;
}

/* ---------- render ---------- */
var cur=0, busy=false;
function render(){
  var first=0; while(first<N && ang[first]>=179.5) first++;
  for(var i=0;i<N;i++){
    var a=ang[i], L=leaves[i], s=Math.sin(a*Math.PI/180);
    L.el.style.transform='rotateY('+(-a).toFixed(2)+'deg)';
    L.el.style.zIndex=(a<90)?(50-i):(50+i);
    L.el.style.visibility=(a<179.5 && (a>0.05 || i<=first+1))?'visible':'hidden';
    L.fshade.style.opacity=(a<90)?(0.7*s).toFixed(3):'0';
    L.bshade.style.opacity=(a>=90)?(0.7*s).toFixed(3):'0';
    L.bface.style.opacity=(a>140)?clamp((179.5-a)/39.5,0,1).toFixed(3):'1';
    var c=0;
    if(i>0){var pa=ang[i-1]; if(pa>0.05 && pa<179.5){c=0.62*Math.sin(pa*Math.PI/180)*(1-pa/190);}}
    L.cast.style.opacity=c.toFixed(3);
  }
}
function ui(){
  for(var i=0;i<N;i++){dots[i].className='dot'+(i===cur?' on':'');}
  btnPrev.disabled=(cur===0);
  var last=(cur===N-1);
  btnNext.innerHTML=last?ICON_REPLAY:ICON_NEXT;
  btnNext.setAttribute('aria-label',last?'फिर से शुरू से देखें':'अगला पन्ना');
  stack.style.opacity=(N>1)?((N-1-cur)/(N-1)).toFixed(2):'1';
}

/* ---------- animation ---------- */
function easeCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function easeSine(t){return -(Math.cos(Math.PI*t)-1)/2;}
function anim(i,to,dur,ease,cb){
  var from=ang[i], t0=null; busy=true;
  function step(now){
    if(t0===null)t0=now;
    var t=Math.min(1,(now-t0)/dur);
    ang[i]=from+(to-from)*ease(t);
    render();
    if(t<1){requestAnimationFrame(step);}
    else{ang[i]=to;render();busy=false;if(cb)cb();}
  }
  requestAnimationFrame(step);
}
function flipNext(dur,ease,cb){
  if(busy||cur>=N-1)return;
  var i=cur;
  anim(i,180,dur||1000,ease||easeCubic,function(){cur++;ui();if(cb)cb();});
}
function flipPrev(dur,cb){
  if(busy||cur<=0)return;
  var i=cur-1;
  anim(i,0,dur||900,easeCubic,function(){cur--;ui();if(cb)cb();});
}
function rewind(){
  if(cur>0){flipPrev(430,rewind);}
}

/* ---------- intro ---------- */
var auto=true, autoT=null;
function cancelAuto(){auto=false;if(autoT){clearTimeout(autoT);autoT=null;}}
function showHint(){hint.className='show';}
function hideHint(){hint.className='';}
function start(){
  wrap.className='';
  setTimeout(showHint,1500);
  autoT=setTimeout(function(){
    if(auto && cur===0 && !busy && !drag){
      flipNext(2100,easeSine);
    }
  },2700);
}

/* ---------- input ---------- */
var drag=null;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}

scene.addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('.ui'))return;
  if(busy)return;
  cancelAuto();
  drag={x0:e.clientX,y0:e.clientY,t0:performance.now(),dir:0,leaf:-1,xs:0,dead:false,
        lx:e.clientX,lt:performance.now(),v:0,id:e.pointerId};
  try{scene.setPointerCapture(e.pointerId);}catch(err){}
});
scene.addEventListener('pointermove',function(e){
  if(!drag||drag.dead)return;
  var dx=e.clientX-drag.x0;
  if(!drag.dir){
    if(Math.abs(dx)>8){
      if(dx<0&&cur<N-1){drag.dir=1;drag.leaf=cur;drag.xs=e.clientX;}
      else if(dx>0&&cur>0){drag.dir=-1;drag.leaf=cur-1;drag.xs=e.clientX;}
      else{drag.dead=true;return;}
    } else return;
  }
  var d2=e.clientX-drag.xs, range=pw*0.9, a;
  if(drag.dir===1){a=clamp(-d2/range*180,0,180);}
  else{a=180-clamp(d2/range*180,0,180);}
  ang[drag.leaf]=a;
  var now=performance.now(), dt=now-drag.lt;
  if(dt>0){drag.v=(e.clientX-drag.lx)/dt;}
  drag.lx=e.clientX;drag.lt=now;
  render();
  if(e.cancelable)e.preventDefault();
});
function endDrag(e,cancelled){
  if(!drag)return;
  var d=drag; drag=null;
  try{scene.releasePointerCapture(d.id);}catch(err){}
  if(d.dir){
    var i=d.leaf, a=ang[i], toEnd, dur;
    if(d.dir===1){toEnd=(a>=60||d.v<-0.45)&&!(d.v>0.45);}
    else{toEnd=!((a<=120||d.v>0.45)&&!(d.v<-0.45));}
    var target=toEnd?180:0;
    dur=260+620*Math.abs(target-a)/180;
    anim(i,target,dur,easeCubic,function(){
      if(d.dir===1&&toEnd)cur++;
      else if(d.dir===-1&&!toEnd)cur--;
      ui();
    });
  } else if(!cancelled&&!d.dead){
    var moved=Math.abs(e.clientX-d.x0)+Math.abs(e.clientY-d.y0);
    if(moved<12&&performance.now()-d.t0<500){
      var r=wrap.getBoundingClientRect();
      if(e.clientX<r.left+r.width*0.28)flipPrev(950);
      else flipNext(1000);
    }
  }
}
scene.addEventListener('pointerup',function(e){endDrag(e,false);});
scene.addEventListener('pointercancel',function(e){endDrag(e,true);});
scene.addEventListener('contextmenu',function(e){e.preventDefault();});
scene.addEventListener('dragstart',function(e){e.preventDefault();});

btnPrev.addEventListener('click',function(){cancelAuto();flipPrev(950);});
btnNext.addEventListener('click',function(){
  cancelAuto();
  if(cur>=N-1){rewind();}else{flipNext(1000);}
});
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){cancelAuto();if(cur>=N-1)rewind();else flipNext(1000);e.preventDefault();}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){cancelAuto();flipPrev(950);e.preventDefault();}
  else if(k==='Home'){cancelAuto();rewind();}
});
document.addEventListener('touchmove',function(e){if(e.cancelable)e.preventDefault();},{passive:false});

var rs=null;
function onResize(){size();}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){setTimeout(onResize,250);});

/* ---------- init ---------- */
size(); render(); ui();
var started=false;
function go(){if(started)return;started=true;requestAnimationFrame(function(){requestAnimationFrame(start);});}
var decs=[];
for(var k=0;k<N;k++){
  var im2=leaves[k].img;
  if(im2.decode){decs.push(im2.decode().catch(function(){}));}
}
if(decs.length&&window.Promise){Promise.all(decs).then(go);}
window.addEventListener('load',go);
setTimeout(go,2500);
})();
</script>
</body>
</html>
